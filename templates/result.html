<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DocFlow - Upload Result</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="container">

        <h1>Upload Successful</h1>

        <p class="subtitle">
            Your document has been received by DocFlow.
        </p>

        <div class="result">

            <p>
                <strong>Filename:</strong>
                {{ filename }}
            </p>

            <p>
                <strong>Size:</strong>
                {{ size }} bytes
            </p>

        </div>

        <a href="/">
            Upload another document
        </a>

    </main>

</body>

</html>
